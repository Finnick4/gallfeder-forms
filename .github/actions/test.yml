name: test.yml
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags: [ v* ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run tests
        run: go test -race ./internal/...
