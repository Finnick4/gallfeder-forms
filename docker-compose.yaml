services:
  gallfeder-forms.database:
    image: postgres:18
    container_name: gallfeder-forms.database
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PW}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - ./db:/var/lib/postgresql
  gallfeder-forms.backend:
    image: ghcr.io/finnick4/gallfeder-forms-backend:latest
    container_name: gallfeder-forms.backend
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=gallfeder-forms.database
    env_file: [.env]
    depends_on:
      gallfeder-forms.database:
        condition: service_healthy
  gallfeder-forms.frontend:
    image: ghcr.io/finnick4/gallfeder-forms-frontend:latest
    container_name: gallfeder-forms.frontend

    ports:
      - "4004:4004"

volumes:
  db:
